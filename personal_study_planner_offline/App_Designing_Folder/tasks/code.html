<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Task Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d5e3fc",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-highest": "#d5e3fc",
                        "surface-dim": "#ccdbf3",
                        "secondary-container": "#82f5c1",
                        "secondary-fixed": "#85f8c4",
                        "surface": "#f8f9ff",
                        "inverse-surface": "#233144",
                        "on-tertiary-fixed": "#2f1500",
                        "outline-variant": "#c3c6d7",
                        "secondary-fixed-dim": "#68dba9",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "primary": "#004ac6",
                        "on-tertiary": "#ffffff",
                        "secondary": "#006c4a",
                        "tertiary-container": "#a65900",
                        "on-surface": "#0d1c2e",
                        "primary-container": "#2563eb",
                        "primary-fixed-dim": "#b4c5ff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb77d",
                        "inverse-primary": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "outline": "#737686",
                        "surface-container-low": "#eff4ff",
                        "on-primary-container": "#eeefff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#005137",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-tertiary-container": "#ffede1",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-background": "#0d1c2e",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "surface-container": "#e6eeff",
                        "tertiary": "#824500",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#434655",
                        "tertiary-fixed": "#ffdcc3",
                        "on-secondary-fixed": "#002114",
                        "on-secondary-container": "#00714e",
                        "surface-tint": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "16px",
                        "base": "8px",
                        "xl": "32px",
                        "margin-tablet": "32px"
                    },
                    "fontFamily": {
                        "stats-number": ["Manrope"],
                        "title-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "stats-number": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .task-checkbox:checked + div {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .task-checkbox:checked + div .check-icon {
            opacity: 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg h-full flex flex-col md:pb-0 pb-[80px]">
<!-- Top App Bar (Mobile & Desktop) -->
<header class="bg-surface dark:bg-on-surface docked full-width top-0 flat no shadows flex justify-between items-center w-full px-margin-mobile py-4 sticky z-40">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 active:scale-98 transition-all md:hidden text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-title-md text-title-md font-bold text-primary dark:text-primary-fixed">StudyPlanner</h1>
</div>
<!-- Desktop Nav -->
<nav class="hidden md:flex gap-8">
<a class="text-on-surface-variant font-body-sm text-body-sm hover:opacity-80 active:scale-98 transition-all flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[20px]">dashboard</span> Dashboard
            </a>
<a class="text-on-surface-variant font-body-sm text-body-sm hover:opacity-80 active:scale-98 transition-all flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[20px]">auto_stories</span> Subjects
            </a>
<a class="text-on-surface-variant font-body-sm text-body-sm hover:opacity-80 active:scale-98 transition-all flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[20px]">calendar_month</span> Calendar
            </a>
<a class="text-primary font-semibold font-body-sm text-body-sm hover:opacity-80 active:scale-98 transition-all flex items-center gap-2 border-b-2 border-primary pb-1" href="#">
<span class="material-symbols-outlined fill text-[20px]">checklist</span> Tasks
            </a>
</nav>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:opacity-80 active:scale-98 transition-all">
<span class="material-symbols-outlined">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-title-md text-[14px]">
                JD
            </div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-7xl mx-auto px-margin-mobile md:px-margin-tablet py-lg md:py-xl flex flex-col gap-lg">
<!-- Page Header -->
<div class="flex justify-between items-end">
<div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-1">Tasks</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Manage your study workflow.</p>
</div>
<button class="p-2 rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Filters -->
<div class="flex gap-2 overflow-x-auto pb-2 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0 scrollbar-hide">
<button class="px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-body-sm text-body-sm font-medium whitespace-nowrap shadow-sm">
                Today
            </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant bg-surface hover:bg-surface-container-low transition-colors font-body-sm text-body-sm font-medium whitespace-nowrap">
                Upcoming
            </button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant bg-surface hover:bg-surface-container-low transition-colors font-body-sm text-body-sm font-medium whitespace-nowrap">
                Completed
            </button>
</div>
<!-- Task List -->
<div class="flex flex-col gap-md mt-sm">
<!-- Task Card 1 (High Priority) -->
<label class="group bg-surface-container-lowest rounded-xl p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-transparent hover:border-primary transition-all cursor-pointer flex gap-4 items-start active:scale-[0.99]">
<div class="relative flex items-center mt-1">
<input class="task-checkbox opacity-0 absolute h-0 w-0" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline-variant rounded-md flex items-center justify-center transition-colors group-hover:border-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 check-icon transition-opacity">check</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-2">
<div class="flex justify-between items-start gap-4">
<span class="font-title-md text-title-md text-on-surface leading-tight">Calculus Problem Set</span>
<div class="px-2 py-1 bg-error-container text-on-error-container rounded font-label-caps text-label-caps shrink-0 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">priority_high</span> High
                        </div>
</div>
<div class="flex flex-wrap items-center gap-3 mt-1">
<span class="px-2 py-1 bg-surface-container text-on-surface font-body-sm text-[12px] rounded-md flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-[#3b82f6]"></span> Math
                        </span>
<span class="text-on-surface-variant font-body-sm text-[13px] flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span> Due 11:59 PM
                        </span>
<span class="text-on-surface-variant font-body-sm text-[13px] flex items-center gap-1 ml-auto md:ml-0">
<span class="material-symbols-outlined text-[16px]">save</span> Local
                        </span>
</div>
</div>
</label>
<!-- Task Card 2 (Medium Priority) -->
<label class="group bg-surface-container-lowest rounded-xl p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-transparent hover:border-primary transition-all cursor-pointer flex gap-4 items-start active:scale-[0.99]">
<div class="relative flex items-center mt-1">
<input class="task-checkbox opacity-0 absolute h-0 w-0" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline-variant rounded-md flex items-center justify-center transition-colors group-hover:border-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 check-icon transition-opacity">check</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-2">
<div class="flex justify-between items-start gap-4">
<span class="font-title-md text-title-md text-on-surface leading-tight">Read Chapter 4: Cell Structure</span>
<div class="px-2 py-1 bg-tertiary-container text-on-tertiary-container rounded font-label-caps text-label-caps shrink-0">
                            Med
                        </div>
</div>
<div class="flex flex-wrap items-center gap-3 mt-1">
<span class="px-2 py-1 bg-surface-container text-on-surface font-body-sm text-[12px] rounded-md flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-[#10b981]"></span> Biology
                        </span>
<span class="text-on-surface-variant font-body-sm text-[13px] flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span> 45 mins est.
                        </span>
</div>
</div>
</label>
<!-- Task Card 3 (Low Priority) -->
<label class="group bg-surface-container-lowest rounded-xl p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-transparent hover:border-primary transition-all cursor-pointer flex gap-4 items-start active:scale-[0.99]">
<div class="relative flex items-center mt-1">
<input class="task-checkbox opacity-0 absolute h-0 w-0" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline-variant rounded-md flex items-center justify-center transition-colors group-hover:border-primary">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 check-icon transition-opacity">check</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-2">
<div class="flex justify-between items-start gap-4">
<span class="font-title-md text-title-md text-on-surface leading-tight">Review Lecture Notes</span>
<div class="px-2 py-1 bg-surface-container-high text-on-surface rounded font-label-caps text-label-caps shrink-0">
                            Low
                        </div>
</div>
<div class="flex flex-wrap items-center gap-3 mt-1">
<span class="px-2 py-1 bg-surface-container text-on-surface font-body-sm text-[12px] rounded-md flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-[#8b5cf6]"></span> History
                        </span>
</div>
</div>
</label>
</div>
</main>
<!-- FAB (Floating Action Button) -->
<button class="fixed bottom-[100px] md:bottom-lg right-margin-mobile md:right-margin-tablet w-[56px] h-[56px] rounded-full bg-primary text-on-primary shadow-lg flex items-center justify-center hover:bg-primary-container active:scale-95 transition-all z-40">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
<!-- Bottom Nav Bar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] bg-surface dark:bg-on-surface rounded-t-xl pb-[env(safe-area-inset-bottom,16px)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-body-sm text-body-sm text-[10px]">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="font-body-sm text-body-sm text-[10px]">Subjects</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">calendar_month</span>
<span class="font-body-sm text-body-sm text-[10px]">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined fill mb-1">checklist</span>
<span class="font-body-sm text-body-sm text-[10px] font-medium">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">more_horiz</span>
<span class="font-body-sm text-body-sm text-[10px]">More</span>
</a>
</nav>
</body></html>
