<style>
        .timer-circle {
            stroke-dasharray: 880;
            stroke-dashoffset: 220; /* 25% complete for visual effect */
            transition: stroke-dashoffset 1s linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-full font-body-lg flex flex-col antialiased">
<!-- Canvas (Main Content) -->
<main class="flex-1 w-full max-w-7xl mx-auto px-margin-mobile md:px-margin-tablet pb-24 md:pb-8 flex flex-col justify-center items-center relative z-0 mt-20 md:mt-0">
<!-- Timer Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-lg flex flex-col items-center w-full max-w-md relative overflow-hidden border border-outline-variant/30">
<!-- Context Header -->
<div class="w-full flex justify-between items-center mb-lg">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current Subject</span>
<div class="flex items-center gap-xs text-primary font-title-md text-title-md mt-1">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">science</span>
<span>Physics</span>
</div>
</div>
<div class="bg-secondary-container/30 px-3 py-1 rounded-full border border-secondary/20">
<span class="font-label-caps text-label-caps text-on-secondary-container">Pomodoro</span>
</div>
</div>
<!-- Large Circular Timer -->
<div class="relative w-64 h-64 mb-xl flex items-center justify-center">
<!-- Background Circle -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 300 300">
<circle class="text-surface-container-high" cx="150" cy="150" fill="none" r="140" stroke="currentColor" stroke-width="8"></circle>
<!-- Progress Circle -->
<circle class="text-secondary timer-circle" cx="150" cy="150" fill="none" r="140" stroke="currentColor" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Time Display -->
<div class="text-center z-10 flex flex-col items-center">
<span class="font-display-lg text-display-lg text-on-surface tracking-tighter">25:00</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-2 flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-secondary inline-block"></span> Focusing
                    </span>
</div>
</div>
<!-- Primary Controls -->
<div class="flex justify-center gap-md w-full mb-lg">
<button class="flex items-center justify-center w-14 h-14 rounded-full bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors border border-outline-variant/50">
<span class="material-symbols-outlined text-2xl">refresh</span>
</button>
<button class="flex items-center justify-center w-16 h-16 rounded-full bg-primary text-on-primary shadow-lg hover:bg-primary-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="flex items-center justify-center w-14 h-14 rounded-full bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors border border-outline-variant/50">
<span class="material-symbols-outlined text-2xl">pause</span>
</button>
</div>
<!-- Sub-controls / Customizer -->
<div class="w-full grid grid-cols-2 gap-md border-t border-outline-variant/30 pt-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant">Study Time</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-2 border border-outline-variant/50">
<span class="material-symbols-outlined text-on-surface-variant mr-2 text-sm">schedule</span>
<input class="bg-transparent border-none p-0 w-full font-stats-number text-stats-number text-on-surface focus:ring-0 text-center" max="120" min="1" type="number" value="25"/>
<span class="font-body-sm text-body-sm text-on-surface-variant ml-1">m</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant">Break Time</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-2 border border-outline-variant/50">
<span class="material-symbols-outlined text-on-surface-variant mr-2 text-sm">local_cafe</span>
<input class="bg-transparent border-none p-0 w-full font-stats-number text-stats-number text-on-surface focus:ring-0 text-center" max="30" min="1" type="number" value="5"/>
<span class="font-body-sm text-body-sm text-on-surface-variant ml-1">m</span>
</div>
</div>
</div>
<!-- Quick Settings Toggle -->
<div class="mt-md w-full flex justify-center">
<button class="text-primary font-body-sm text-body-sm flex items-center gap-1 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-sm">tune</span>
                     Advanced Settings
                 </button>
</div>
</div>
</main>
<!-- Top Navigation (Web) -->
<header class="hidden md:flex justify-between items-center w-full px-margin-tablet py-4 docked full-width top-0 bg-surface dark:bg-on-surface fixed z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">menu_book</span>
<span class="font-title-md text-title-md font-bold text-primary dark:text-primary-fixed">StudyPlanner</span>
</div>
<nav class="flex items-center gap-8">
<a class="text-on-surface-variant hover:opacity-80 transition-all font-body-lg text-body-lg" href="#">Dashboard</a>
<a class="text-on-surface-variant hover:opacity-80 transition-all font-body-lg text-body-lg" href="#">Subjects</a>
<a class="text-primary font-semibold hover:opacity-80 transition-all font-body-lg text-body-lg" href="#">Timer</a>
<a class="text-on-surface-variant hover:opacity-80 transition-all font-body-lg text-body-lg" href="#">Tasks</a>
</nav>
<div class="flex items-center gap-4 text-on-surface-variant">
<span class="material-symbols-outlined hover:opacity-80 cursor-pointer">calendar_today</span>
</div>
</header>
<!-- Mobile Header -->
<header class="md:hidden flex justify-between items-center w-full px-margin-mobile py-4 docked full-width top-0 bg-surface dark:bg-on-surface fixed z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">menu_book</span>
<span class="font-title-md text-title-md font-bold text-primary dark:text-primary-fixed">StudyPlanner</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</header>
<!-- Bottom Navigation Shell (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] bg-surface dark:bg-on-surface rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-body-sm text-body-sm text-[10px]">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="font-body-sm text-body-sm text-[10px]">Subjects</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-body-sm text-body-sm text-[10px] font-medium">Timer</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">checklist</span>
<span class="font-body-sm text-body-sm text-[10px]">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">more_horiz</span>
<span class="font-body-sm text-body-sm text-[10px]">More</span>
</a>
</nav>
</body></html>
